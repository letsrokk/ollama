services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui-data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      WEBUI_AUTH: "false"
      HF_HUB_OFFLINE: "1"
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      RAG_EMBEDDING_MODEL: "qwen3-embedding:0.6b"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "2"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.5.29-780ee3256
    container_name: searxng
    entrypoint: ["/etc/searxng/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:?set BRAVE_SEARCH_API_KEY in .env}"
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    restart: unless-stopped
